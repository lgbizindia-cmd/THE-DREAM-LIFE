<style>
:root{
  --cream:#fbf6ee; --paper:#fffdf8; --ink:#1f1b16; --muted:#6b645a; --line:#e8dfd0;
  --green:#0f6b57; --greenDeep:#0a4a3d; --greenSoft:#e3f2ec;
  --coral:#e8603c; --coralSoft:#fdebe4; --sun:#f6b73c; --sunSoft:#fff3d6;
  --shadow:0 20px 50px rgba(31,27,22,.10);
  --display:"Fraunces","Noto Sans Devanagari","Noto Sans Gujarati",Georgia,serif;
  --body:"Hanken Grotesk","Noto Sans Devanagari","Noto Sans Gujarati",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;padding-bottom:84px;-webkit-text-size-adjust:100%}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;text-wrap:balance}
h2{font-size:clamp(1.8rem,5.2vw,2.9rem);line-height:1.1;font-weight:700}
h3{line-height:1.2}
button,a{touch-action:manipulation}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.wrap{width:min(1120px,calc(100% - 32px));margin:auto}
.section{padding:72px 0}
.kicker{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);background:var(--coralSoft);padding:6px 12px;border-radius:999px}
.lede{color:var(--muted);max-width:60ch;margin-top:14px}
.center{text-align:center}.center .lede{margin-left:auto;margin-right:auto}

/* Hindi / Gujarati typography */
html[lang="hi"] h1,html[lang="hi"] h2,html[lang="hi"] h3,
html[lang="gu"] h1,html[lang="gu"] h2,html[lang="gu"] h3{letter-spacing:0;font-family:var(--body)}
html[lang="hi"] h1,html[lang="gu"] h1{line-height:1.25}
html[lang="hi"] h2,html[lang="gu"] h2{line-height:1.28}
html[lang="hi"] h3,html[lang="gu"] h3{line-height:1.35}
html[lang="hi"] .kicker,html[lang="gu"] .kicker{letter-spacing:.03em;text-transform:none;font-size:13px}
html[lang="hi"] body,html[lang="gu"] body{line-height:1.7}

/* NAV */
.nav{position:sticky;top:0;z-index:40;background:rgba(251,246,238,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0}
.brand{display:flex;align-items:center;gap:9px;font:800 17px var(--body)}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--green);color:#fff;display:grid;place-items:center;font-style:normal;font-size:15px}
.nav-r{display:flex;align-items:center;gap:12px}
.secure{font-size:12.5px;color:var(--green);font-weight:700}
.lang-sw{display:inline-flex;padding:3px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.lang-sw button{appearance:none;border:0;background:transparent;color:var(--muted);font:700 13px/1 var(--body);padding:9px 13px;border-radius:999px;cursor:pointer;min-height:34px;transition:.15s}
.lang-sw button:hover{color:var(--ink)}
.lang-sw button[aria-pressed="true"]{background:var(--green);color:#fff}

/* HERO */
.hero{padding:44px 0 30px;text-align:center;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:var(--sunSoft);left:50%;top:-250px;transform:translateX(-50%);z-index:0}
.hero .wrap{position:relative;z-index:1}
.hero h1{font-size:clamp(2.3rem,7.5vw,4.4rem);line-height:1.02;font-weight:800;margin:18px auto 0;max-width:15ch}
.hero h1 em{font-style:normal;color:var(--coral)}
.hero-sub{margin:18px auto 0;max-width:60ch;color:var(--muted);font-size:18px}
.hero-sub strong{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.chip{padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:700}
.offer{display:flex;align-items:baseline;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.offer .now{font:800 3.4rem/1 var(--display);color:var(--green)}
.offer s{color:var(--muted);font-size:19px}
.save{background:var(--coral);color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:5px 11px}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--green);color:#fff;text-decoration:none;font-weight:800;border-radius:16px;padding:17px 26px;min-height:56px;box-shadow:0 8px 0 var(--greenDeep);transition:.15s transform,.15s box-shadow;text-align:center;margin-top:20px}
.cta:hover{transform:translateY(-2px);box-shadow:0 10px 0 var(--greenDeep)}
.cta:active{transform:translateY(6px);box-shadow:0 2px 0 var(--greenDeep)}
.micro{margin-top:18px;color:var(--muted);font-size:12.5px}
.covers{display:flex;justify-content:center;align-items:flex-end;margin-top:38px;padding:0 6px}
.covers img{width:19%;max-width:190px;aspect-ratio:520/745;object-fit:cover;border-radius:8px;box-shadow:0 18px 36px rgba(31,27,22,.25);border:3px solid #fff;margin:0 -1.4%}
.covers img:nth-child(1){transform:rotate(-7deg) translateY(14px)}
.covers img:nth-child(2){transform:rotate(-3deg) translateY(4px)}
.covers img:nth-child(3){transform:translateY(-14px) scale(1.12);z-index:3}
.covers img:nth-child(4){transform:rotate(3deg) translateY(4px)}
.covers img:nth-child(5){transform:rotate(7deg) translateY(14px)}

/* STATS */
.stats{margin-top:34px}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center}
.stat b{display:block;font:800 2.2rem/1 var(--display);color:var(--green)}
.stat small{display:block;margin-top:6px;color:var(--muted);font-size:12.5px;line-height:1.3}

/* PROBLEM */
.problem-grid{display:grid;gap:14px;margin-top:30px}
.pcard{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;gap:13px;align-items:flex-start}
.pcard span{flex:none;width:30px;height:30px;border-radius:10px;background:var(--coralSoft);color:var(--coral);display:grid;place-items:center;font-weight:900}
.bridge{margin-top:22px;border-radius:24px;padding:28px 24px;background:var(--green);color:#fff;text-align:center;box-shadow:var(--shadow)}
.bridge .big{font:800 clamp(1.5rem,4.5vw,2.2rem)/1.15 var(--display)}
.bridge p{margin:10px auto 0;color:#cfeadf;max-width:58ch}

/* SYSTEM */
.steps3{display:grid;gap:14px;margin-top:30px;position:relative}
.s3{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px;position:relative}
.s3 .n{display:inline-block;font:800 12px var(--body);letter-spacing:.1em;color:var(--green);background:var(--greenSoft);padding:5px 10px;border-radius:999px}
.s3 h3{margin-top:12px;font-size:1.35rem}.s3 p{margin-top:6px;color:var(--muted);font-size:15px}

/* GUIDES (zigzag) */
.guide{display:grid;gap:22px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:22px;margin-top:20px}
.guide .pic{display:flex;justify-content:center;background:var(--sunSoft);border-radius:22px;padding:24px}
.guide .pic img{width:min(190px,60%);aspect-ratio:520/745;object-fit:cover;border-radius:8px;box-shadow:0 18px 34px rgba(31,27,22,.28)}
.guide .tag{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--greenSoft);color:var(--green);font-size:11px;font-weight:800}
.guide h3{margin-top:10px;font-size:1.55rem}
.guide .one{margin-top:7px;color:var(--muted)}
.guide ul{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:9px}
.guide li{display:flex;gap:9px;font-size:15px}
.guide li:before{content:"✓";color:var(--green);font-weight:900;flex:none}
.bonus{margin-top:28px;border:2px dashed var(--sun);background:var(--sunSoft);border-radius:26px;padding:24px}
.bonus-top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.bonus h3{font-size:1.4rem}
.bonus-badge{background:var(--ink);color:#fff;border-radius:999px;padding:6px 12px;font-size:11px;font-weight:800}
.bonus ul{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:10px}
.bonus li{display:flex;gap:9px;font-size:15px}
.bonus li:before{content:"🎁";flex:none}

/* BUY */
.buy{background:var(--greenDeep);color:#fff;position:relative;overflow:hidden}
.buy:before{content:"";position:absolute;width:480px;height:480px;border-radius:50%;background:rgba(246,183,60,.10);right:-200px;top:-200px}
.buy .wrap{position:relative;z-index:1}
.buy .kicker{background:rgba(255,255,255,.12);color:#ffe3a0}
.buy h2{margin-top:12px}.buy .lede{color:#bfe0d4}
.buy-card{margin:30px auto 0;max-width:560px;background:var(--paper);color:var(--ink);border-radius:28px;padding:26px;box-shadow:0 26px 70px rgba(0,0,0,.30)}
.buy-price{display:flex;align-items:baseline;gap:10px}
.buy-price b{font:800 3.4rem/1 var(--display);color:var(--green)}
.buy-price s{color:var(--muted);font-size:17px}
.save2{color:var(--green);font-size:13px;font-weight:800;margin-top:6px}
.lang{display:flex;justify-content:space-between;align-items:center;gap:15px;text-decoration:none;background:var(--coral);color:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 7px 0 #b8421f;transition:.15s transform;margin-top:20px}
.lang:hover{transform:translateY(-1px)}
.lang:active{transform:translateY(5px);box-shadow:0 2px 0 #b8421f}
.lang .nm{display:block;font-size:1.25rem;font-weight:800}
.lang .ed{display:block;font-size:12px;opacity:.85}
.lang .go{font-weight:800;white-space:nowrap}
.others{margin-top:18px;text-align:center;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 10px;justify-content:center;align-items:center}
.others a{display:inline-block;padding:7px 14px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-weight:700;background:#fff}
.others a:hover{border-color:var(--green)}
.assure{display:flex;flex-wrap:wrap;justify-content:center;gap:7px 16px;margin-top:16px;color:var(--muted);font-size:12.5px}
.assure span:before{content:"✓";color:var(--green);font-weight:900;margin-right:5px}

/* HOW */
.how{display:grid;gap:14px;margin-top:30px}
.how-i{display:flex;gap:16px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px}
.how-n{flex:none;width:48px;height:48px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:800 1.2rem var(--display)}
.how-i h3{font-size:1.1rem}.how-i p{margin-top:4px;color:var(--muted);font-size:14.5px}

/* FIT */
.fit{display:grid;gap:14px;margin-top:30px}
.fit-card{border-radius:24px;padding:24px;border:1px solid var(--line)}
.fit-card.yes{background:var(--greenSoft);border-color:#c7e4d8}
.fit-card.no{background:var(--paper)}
.fit-card h3{font-size:1.25rem}
.fit-card ul{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.fit-card li{display:flex;gap:9px;font-size:15px}
.fit-card.yes li:before{content:"✓";color:var(--green);font-weight:900;flex:none}
.fit-card.no li:before{content:"×";color:#9a9183;font-weight:900;flex:none}

/* FAQ */
.faq{display:grid;gap:10px;margin:30px auto 0;max-width:780px}
.faq details{background:var(--paper);border:1px solid var(--line);border-radius:16px}
.faq summary{cursor:pointer;list-style:none;padding:18px 50px 18px 20px;font-weight:700;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";position:absolute;right:20px;top:12px;font-size:26px;color:var(--coral);font-weight:400}
.faq details[open] summary:after{content:"−"}
.ans{padding:0 20px 18px;color:var(--muted);font-size:15px}

/* FINAL */
.final{padding:20px 0 80px}
.final-box{background:var(--ink);color:#fff;border-radius:32px;text-align:center;padding:46px 22px;box-shadow:var(--shadow)}
.final-box .kicker{background:rgba(255,255,255,.12);color:#ffe3a0}
.final-box h2{margin-top:14px}
.final-box p{margin:12px auto 0;color:#cfc8bb;max-width:560px}
.final-box .cta{background:var(--coral);box-shadow:0 8px 0 #b8421f}
.final-box .cta:active{box-shadow:0 2px 0 #b8421f}

/* FOOTER */
footer{border-top:1px solid var(--line);padding:34px 0;color:var(--muted);font-size:13px;background:var(--paper)}
.fbrand{font:800 1.1rem var(--body);color:var(--ink)}
.contact{margin-top:10px}
.fine{margin-top:14px;max-width:800px;font-size:12px;line-height:1.55}

/* STICKY */
.sticky{position:fixed;z-index:50;left:0;right:0;bottom:0;background:rgba(255,253,248,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);box-shadow:0 -10px 28px rgba(31,27,22,.10);padding:9px 14px calc(9px + env(safe-area-inset-bottom))}
.sticky-row{width:min(1120px,100%);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sticky-price{display:flex;align-items:baseline;gap:7px}
.sticky-price b{font:800 1.6rem var(--display);color:var(--green)}
.sticky-price s{font-size:12px;color:var(--muted)}
.sticky .cta{margin-top:0;padding:12px 20px;min-height:46px;font-size:14px;box-shadow:0 4px 0 var(--greenDeep)}

/* RESPONSIVE */
@media(min-width:760px){
  .wrap{width:min(1120px,calc(100% - 56px))}
  .section{padding:96px 0}
  .stats-grid{grid-template-columns:repeat(4,1fr)}
  .problem-grid{grid-template-columns:1fr 1fr}
  .steps3{grid-template-columns:repeat(3,1fr)}
  .guide{grid-template-columns:300px 1fr;padding:28px;gap:36px}
  .guide:nth-of-type(even){grid-template-columns:1fr 300px}
  .guide:nth-of-type(even) .pic{order:2}
  .how{grid-template-columns:repeat(3,1fr)}
  .how-i{display:block}.how-n{margin-bottom:14px}
  .fit{grid-template-columns:1fr 1fr}
  .buy-card{padding:34px}
  .final-box{padding:62px 40px}
}
@media(max-width:520px){
  .secure{display:none}
  .offer .now{font-size:2.9rem}
  .covers img{width:21%}
}
/* ===================== ANIMATIONS ===================== */
.progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--coral),var(--sun));z-index:60;transition:width .1s linear}

/* scroll reveal */
.reveal{opacity:0;transform:translateY(34px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

/* hero entrance */
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.hero .kicker,.hero h1,.hero-sub,.hero .chips,.hero .offer,.hero .cta,.hero .micro,.hero .stats{animation:rise .8s cubic-bezier(.2,.7,.2,1) backwards}
.hero .kicker{animation-delay:.05s}.hero h1{animation-delay:.15s}.hero-sub{animation-delay:.3s}
.hero .chips{animation-delay:.4s}.hero .offer{animation-delay:.5s}.hero .cta{animation-delay:.6s}
.hero .micro{animation-delay:.7s}.hero .stats{animation-delay:1.1s}

/* shimmering headline accent */
.hero h1 em{background:linear-gradient(90deg,var(--coral),var(--sun),var(--coral));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shimmer 4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* drifting background blobs */
.hero:after{content:"";position:absolute;width:380px;height:380px;border-radius:50%;background:var(--coralSoft);right:-120px;bottom:-60px;opacity:.7;z-index:0;animation:drift 12s ease-in-out infinite alternate}
.hero:before{animation:drift2 14s ease-in-out infinite alternate}
@keyframes drift{to{translate:-50px -40px}}
@keyframes drift2{to{translate:60px 30px}}

/* floating covers */
@keyframes coverIn{from{opacity:0;scale:.7;translate:0 50px}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -12px}}
.covers img{animation:coverIn .9s cubic-bezier(.2,.8,.2,1) backwards,bob 5s ease-in-out infinite}
.covers img:nth-child(1){animation-delay:.7s,1.6s}
.covers img:nth-child(2){animation-delay:.8s,2.2s}
.covers img:nth-child(3){animation-delay:.9s,.8s}
.covers img:nth-child(4){animation-delay:1s,2.8s}
.covers img:nth-child(5){animation-delay:1.1s,1.2s}

/* CTA shine + breathing */
.cta{position:relative;overflow:hidden}
.cta:after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,55%{left:-70%}100%{left:130%}}
@keyframes breathe{0%,100%{scale:1}50%{scale:1.035}}
.hero .cta,.final-box .cta,.lang{animation:breathe 2.6s ease-in-out infinite}
.hero .cta{animation:rise .8s cubic-bezier(.2,.7,.2,1) .6s backwards,breathe 2.6s ease-in-out 1.6s infinite}
.lang{position:relative;overflow:hidden}
.lang:after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite;pointer-events:none}

/* floating guide covers */
.guide.in .pic img{animation:bob 6s ease-in-out infinite}
.bonus li:before{display:inline-block;animation:wiggle 3s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{rotate:0deg}85%{rotate:-14deg}90%{rotate:12deg}95%{rotate:-8deg}}
.bridge .big{background:linear-gradient(90deg,#fff,var(--sun),#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 5s linear infinite}
.stat b{transition:color .3s}

/* marquee ticker */
.marquee{overflow:hidden;background:var(--ink);color:#fff;padding:14px 0;white-space:nowrap}
.mq-track{display:inline-flex;animation:mq 32s linear infinite;will-change:transform}
.mq-track span{font-weight:700;font-size:14px;margin-right:42px}
.mq-track span:before{content:"✦";color:var(--sun);margin-right:12px}
@keyframes mq{to{transform:translateX(-50%)}}
.marquee:hover .mq-track{animation-play-state:paused}

/* reviews */
.reviews{background:var(--sunSoft)}
.rv-scroll{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:30px 4px 18px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.rv-scroll::-webkit-scrollbar{height:7px}
.rv-scroll::-webkit-scrollbar-thumb{background:#e2cf9f;border-radius:999px}
.rv-card{flex:0 0 min(360px,84vw);scroll-snap-align:start;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 30px rgba(31,27,22,.08);display:flex;flex-direction:column;min-height:210px;animation:rise .6s ease backwards}
.rv-stars{color:#f3a400;letter-spacing:3px;font-size:18px;line-height:1}
.rv-card p{margin-top:14px;color:#453f36;font-size:15px;line-height:1.65}

var DEFAULT="hi";

function pick(){
  var q=null;
  try{q=new URLSearchParams(location.search).get("lang");}catch(e){}
  if(q&&T[q])return q;
  try{var s=localStorage.getItem("bg_lang");if(s&&T[s])return s;}catch(e){}
  return DEFAULT;
}

function setLang(l,fromUser){
  if(!T[l])l=DEFAULT;
  var d=T[l],en=T.en;
  document.documentElement.lang=l;
  var nodes=document.querySelectorAll("[data-i18n]");
  for(var i=0;i<nodes.length;i++){
    var k=nodes[i].getAttribute("data-i18n");
    var v=(d[k]!==undefined)?d[k]:en[k];
    if(v!==undefined)nodes[i].innerHTML=v;
  }
  document.title=d.title;
  var md=document.querySelector('meta[name="description"]');if(md)md.setAttribute("content",d.desc);
  var ot=document.querySelector('meta[property="og:title"]');if(ot)ot.setAttribute("content",d.title);

  var btns=document.querySelectorAll(".lang-sw button");
  for(var j=0;j<btns.length;j++){
    btns[j].setAttribute("aria-pressed",btns[j].getAttribute("data-l")===l?"true":"false");
  }

  var main=document.getElementById("buyMain");
  main.href=LINKS[l];
  document.getElementById("buyName").textContent=NAMES[l];
  var box=document.getElementById("others");
  box.innerHTML="";
  var lab=document.createElement("span");lab.textContent=d.buyOther;box.appendChild(lab);
  ORDER.forEach(function(o){
    if(o===l)return;
    var a=document.createElement("a");
    a.href=LINKS[o];a.target="_blank";a.rel="noopener";a.className="js-buy";
    a.textContent=NAMES[o];
    box.appendChild(a);
  });

  afterLang(l,d);
  try{localStorage.setItem("bg_lang",l);}catch(e){}
  if(fromUser){
    try{history.replaceState(null,"",location.pathname+"?lang="+l+location.hash);}catch(e){}
    if(typeof fbq==="function")fbq("trackCustom","LanguageSelected",{language:l});
  }
}

document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest(".lang-sw button");
  if(b){setLang(b.getAttribute("data-l"),true);return;}
  var buy=e.target.closest&&e.target.closest(".js-buy");

    fbq("track","InitiateCheckout",{value:299,currency:"INR",content_name:"Dream Life Bundle ("+document.documentElement.lang+")"});

  var hq=document.getElementById("heroQuote"),bp=document.getElementById("buyProof");

  if(bp){bp.innerHTML=mini(REVIEWS[REVIEWS.length>3?3:0]);bp.hidden=false;}
  var sc=document.getElementById("rvList");
  sc.innerHTML=html;
  if(!rvTimer){
    ["pointerdown","touchstart","mouseenter","focusin"].forEach(function(ev){sc.addEventListener(ev,function(){rvPaused=true;},{passive:true});});
    sc.addEventListener("mouseleave",function(){rvPaused=false;});
    rvTimer=setInterval(function(){
      if(rvPaused||document.hidden)return;
      var card=sc.querySelector(".rv-card");if(!card)return;
      var step=card.offsetWidth+16;
      if(sc.scrollLeft+sc.clientWidth>=sc.scrollWidth-8)sc.scrollTo({left:0,behavior:"smooth"});
      else sc.scrollBy({left:step,behavior:"smooth"});
    },4200);
  }
}

/* ===================== SCROLL: progress, depth, sticky bar ===================== */
var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var progress=document.getElementById("progress"),sticky=document.getElementById("sticky");
var buyVisible=false,sent={};
function onScroll(){
  var h=document.documentElement,max=h.scrollHeight-window.innerHeight;
  var p=max>0?(window.pageYOffset||h.scrollTop)/max:0;
  progress.style.width=(Math.min(1,p)*100)+"%";
  [25,50,75,100].forEach(function(m){
    if(!sent[m]&&p*100>=(m===100?97:m)){sent[m]=1;ev("trackCustom","ScrollDepth",{percent:m});}
  });
  var show=(window.pageYOffset||h.scrollTop)>480&&!buyVisible;
  sticky.classList.toggle("show",show);
}
window.addEventListener("scroll",onScroll,{passive:true});
window.addEventListener("resize",onScroll);
onScroll();

/* ===================== OBSERVERS ===================== */
if("IntersectionObserver" in window){
  /* reveal on scroll */
  if(!reduce){
    var rsel="section .kicker,section .lede,section h2,.pcard,.s3,.guide,.bonus,.how-i,.fit-card,.faq details,.buy-card,.final-box,.bridge,.stat";
    var rio=new IntersectionObserver(function(es){
      es.forEach(function(x){if(x.isIntersecting){x.target.classList.add("in");rio.unobserve(x.target);}});
    },{threshold:.12,rootMargin:"0px 0px -40px 0px"});
    Array.prototype.forEach.call(document.querySelectorAll(rsel),function(el){
      var i=Array.prototype.indexOf.call(el.parentNode.children,el);
      el.classList.add("reveal");
      el.style.transitionDelay=((i%4)*90)+"ms";
      rio.observe(el);
    });
  }

  /* count-up numbers */
  var nums=document.querySelectorAll(".stat b");
  var cio=new IntersectionObserver(function(es){
    es.forEach(function(x){
      if(!x.isIntersecting)return;
      var el=x.target,end=parseInt(el.getAttribute("data-n"),10),t0=null;
      cio.unobserve(el);
      if(reduce){el.textContent=end;return;}
      function step(ts){
        if(!t0)t0=ts;
        var p=Math.min(1,(ts-t0)/1300),e=1-Math.pow(1-p,3);
        el.textContent=Math.round(end*e);
        if(p<1)requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  },{threshold:.6});
  Array.prototype.forEach.call(nums,function(el){
    el.setAttribute("data-n",el.textContent.trim());
    el.textContent="0";
    cio.observe(el);
  });

  /* buy section: hide sticky bar there + track view */
  var buy=document.getElementById("buy"),buyTracked=false;
  new IntersectionObserver(function(es){
    es.forEach(function(x){
      buyVisible=x.isIntersecting;
      if(x.isIntersecting&&!buyTracked){buyTracked=true;ev("trackCustom","ViewBuySection");}
      onScroll();
    });
  },{threshold:.25}).observe(buy);
}

setLang(pick(),false);
