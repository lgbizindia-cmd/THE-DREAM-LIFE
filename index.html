<style>
:root{
  --bg:#f7f8fc; --surface:#fff; --ink:#11152f; --muted:#606680; --line:#e5e7f0;
  --deep:#101533; --deep2:#171d48; --gold:#ffb21a; --gold2:#ffd15a; --goldInk:#2a1a00;
  --green:#168653; --greenSoft:#e8f7ef; --rose:#fff0eb; --shadow:0 18px 55px rgba(17,21,47,.10);
  --display:"Bricolage Grotesque","Hanken Grotesk","Noto Sans Devanagari","Noto Sans Gujarati",system-ui,sans-serif;
  --body:"Hanken Grotesk","Noto Sans Devanagari","Noto Sans Gujarati",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hi:"Noto Sans Devanagari","Hanken Grotesk",sans-serif;

}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;padding-bottom:92px;-webkit-text-size-adjust:100%}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display);letter-spacing:-.025em;text-wrap:balance}
h2{font-size:clamp(1.85rem,5.5vw,3rem);line-height:1.06;font-weight:800}
h3{line-height:1.12}
button,a{touch-action:manipulation}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.in{width:min(1100px,calc(100% - 32px));margin:auto}
.section{padding:70px 0}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#b87900}
.eyebrow:before{content:"";width:22px;height:2px;background:currentColor;border-radius:3px;flex:none}
.lede{color:var(--muted);max-width:64ch;margin-top:14px}
.center{text-align:center}.center .lede{margin-left:auto;margin-right:auto}

/* Hindi / Gujarati typography tweaks (taller line-height, no negative tracking) */
html[lang="hi"] h1,html[lang="hi"] h2,html[lang="hi"] h3,
html[lang="gu"] h1,html[lang="gu"] h2,html[lang="gu"] h3{letter-spacing:0}
html[lang="hi"] h1,html[lang="gu"] h1{line-height:1.22}
html[lang="hi"] h2,html[lang="gu"] h2{line-height:1.25}
html[lang="hi"] h3,html[lang="gu"] h3{line-height:1.3}
html[lang="hi"] .eyebrow,html[lang="gu"] .eyebrow{letter-spacing:.04em;text-transform:none;font-size:13px}
html[lang="hi"] body,html[lang="gu"] body{line-height:1.65}

/* HERO */
.hero{position:relative;overflow:hidden;color:#fff;background:
 radial-gradient(circle at 78% 18%,rgba(255,178,26,.18),transparent 27%),
 radial-gradient(circle at 10% 85%,rgba(100,110,255,.18),transparent 32%),
 linear-gradient(135deg,var(--deep),var(--deep2));padding:22px 0 62px}
.hero:after{content:"";position:absolute;inset:auto -10% -120px;height:220px;background:var(--bg);border-radius:50% 50% 0 0/45% 45% 0 0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:0 0 28px;color:#b8bfdd;font-size:13px}
.topbar strong{font-family:var(--display);font-size:17px;color:#fff}
.topbar .secure{display:inline-flex;align-items:center;gap:7px}
.top-right{display:flex;align-items:center;gap:14px}

/* LANGUAGE SWITCHER */
.lang-sw{display:inline-flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18)}
.lang-sw button{appearance:none;border:0;background:transparent;color:#d6dbf1;font:700 13px/1 var(--body);padding:9px 13px;border-radius:999px;cursor:pointer;min-height:34px;transition:.15s background,.15s color}
.lang-sw button:hover{color:#fff}
.lang-sw button[aria-pressed="true"]{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--goldInk)}

.hero-grid{position:relative;z-index:2;display:grid;gap:42px;align-items:center}
.hero-copy .eyebrow{color:var(--gold2)}
.hero h1{font-size:clamp(2.35rem,8vw,4.5rem);line-height:.98;margin-top:14px;max-width:720px}
.hero h1 em{font-style:normal;color:var(--gold2)}
.hero-sub{margin-top:19px;color:#c2c7df;font-size:18px;max-width:650px}
.hero-sub strong{color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:19px}
.pill{padding:7px 11px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);border-radius:999px;color:#e6e8f3;font-size:13px;font-weight:600}
.offer{margin-top:25px;display:flex;align-items:end;gap:11px;flex-wrap:wrap}
.offer .now{font:800 3.35rem/1 var(--display);color:#fff}
.offer s{color:#aeb4d1;font-size:18px}
.save{background:var(--gold);color:var(--goldInk);font-size:12px;font-weight:800;border-radius:999px;padding:5px 10px;margin-bottom:6px}
.cta-main{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--goldInk);text-decoration:none;font-weight:800;border-radius:14px;padding:16px 22px;min-height:54px;box-shadow:0 12px 30px rgba(255,178,26,.24);transition:.18s transform,.18s box-shadow;text-align:center}
.cta-main:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(255,178,26,.30)}
.cta-wrap{margin-top:18px}
.micro{margin-top:10px;color:#9da5c8;font-size:12.5px}
.hero-art{position:relative;display:flex;justify-content:center;align-items:center;min-height:410px}
.orbit{position:absolute;width:360px;height:360px;border:1px solid rgba(255,255,255,.10);border-radius:50%}
.orbit:before,.orbit:after{content:"";position:absolute;border-radius:50%;background:var(--gold);box-shadow:0 0 28px rgba(255,178,26,.45)}
.orbit:before{width:9px;height:9px;top:8%;right:12%}.orbit:after{width:6px;height:6px;bottom:18%;left:7%}
.fan{position:relative;width:min(520px,100%);height:420px;display:flex;justify-content:center;align-items:center}
.fan img{position:absolute;width:29%;aspect-ratio:520/745;object-fit:cover;border-radius:7px;box-shadow:0 24px 45px rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.13)}
.fan .a{transform:translate(-112px,22px) rotate(-12deg);z-index:1}.fan .b{transform:translate(-60px,7px) rotate(-6deg);z-index:2}
.fan .mid{width:36%;transform:translateY(-16px);z-index:5}.fan .c{transform:translate(60px,7px) rotate(6deg);z-index:2}.fan .d{transform:translate(112px,22px) rotate(12deg);z-index:1}
.hero-bottom{position:relative;z-index:4;margin-top:25px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;color:#c5c9df;font-size:13px}
.hero-bottom span{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)}
.check{color:var(--green);font-weight:900}

/* VALUE STRIP */
.value-strip{background:#fff;border-bottom:1px solid var(--line);padding:19px 0}
.value-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.value-item{display:flex;gap:10px;align-items:center}
.value-num{font:800 1.55rem/1 var(--display);white-space:nowrap}.value-item small{display:block;color:var(--muted);font-size:12.5px;line-height:1.25}

/* PAIN */
.pain{background:linear-gradient(180deg,#fff,var(--bg))}
.pain-grid{display:grid;gap:28px;align-items:center}
.problem-card{margin-top:25px;display:grid;gap:10px}
.problem{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:0 6px 20px rgba(17,21,47,.04)}
.problem .icon{width:26px;height:26px;border-radius:50%;background:var(--rose);display:grid;place-items:center;color:#d65a38;font-weight:900;flex:none}
.bridge{margin-top:22px;border-radius:18px;padding:22px;background:linear-gradient(135deg,#151a3b,#242b5c);color:#fff;box-shadow:var(--shadow)}
.bridge .big{font:800 clamp(1.35rem,4vw,1.85rem)/1.2 var(--display)}
.bridge p{margin-top:9px;color:#c6cbe2}

/* SYSTEM */
.system-flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}
.flow{padding:18px;border-radius:16px;border:1px solid var(--line);background:#fff;box-shadow:0 8px 25px rgba(17,21,47,.04)}
.flow .n{font:800 13px/1 var(--display);color:#b87900}.flow h3{margin-top:7px;font-size:1.3rem}.flow p{margin-top:6px;color:var(--muted);font-size:14px}

/* GUIDES */
.guides{display:grid;gap:16px;margin-top:30px}
.guide{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;grid-template-columns:92px 1fr;gap:15px;box-shadow:0 8px 28px rgba(17,21,47,.045)}
.guide img{width:92px;aspect-ratio:520/745;object-fit:cover;border-radius:7px;box-shadow:0 10px 20px rgba(17,21,47,.18)}
.guide .tag{display:inline-block;padding:4px 9px;border-radius:999px;background:#f0f2fa;color:#555d7d;font-size:11px;font-weight:800}
.guide h3{margin-top:8px;font-size:1.3rem}.guide .one{margin-top:7px;color:var(--muted);font-size:14px}
.guide ul{grid-column:1/-1;margin:0;padding:14px 0 0;border-top:1px solid var(--line);list-style:none;display:grid;gap:8px}
.guide li{display:flex;gap:8px;font-size:14px}.guide li:before{content:"✓";color:var(--green);font-weight:900;flex:none}

/* BONUS / VALUE */
.bonus{margin-top:18px;border:1px solid #f0d18b;background:linear-gradient(135deg,#fff8e8,#fff2cf);border-radius:20px;padding:22px}
.bonus-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.bonus h3{font-size:1.35rem}.bonus-badge{background:#fff;border:1px solid #eed08c;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.bonus ul{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:9px}.bonus li{display:flex;gap:9px;font-size:14px}.bonus li:before{content:"✓";color:var(--green);font-weight:900;flex:none}
.value-stack{margin-top:32px;border-radius:24px;background:var(--deep);color:#fff;padding:28px;box-shadow:var(--shadow)}
.value-stack .eyebrow{color:var(--gold2)}.value-stack h2{margin-top:10px}.stack-row{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.11);color:#d8dced}.stack-row:last-child{border:0}.stack-row b:last-child{white-space:nowrap;color:#fff}.stack-total{display:flex;justify-content:space-between;gap:12px;margin-top:10px;padding-top:18px;border-top:1px solid rgba(255,255,255,.18);font:800 1.45rem var(--display)}.stack-total strong{color:var(--gold2)}

/* REVIEWS */
.reviews-section{padding:70px 0;background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}
.review-scroll{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:28px 4px 16px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.review-scroll::-webkit-scrollbar{height:7px}.review-scroll::-webkit-scrollbar-thumb{background:#d9dcea;border-radius:999px}
.review-card{flex:0 0 min(360px,82vw);scroll-snap-align:start;background:#fafbff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 10px 28px rgba(17,21,47,.06);min-height:220px;display:flex;flex-direction:column}
.stars{letter-spacing:3px;color:#f3a400;font-size:18px;line-height:1}
.review-card p{margin-top:15px;color:#3f4562;font-size:15px;line-height:1.6}
.reviewer{margin-top:auto;padding-top:18px;display:flex;justify-content:space-between;gap:10px;align-items:end;border-top:1px solid var(--line)}
.reviewer strong{font-size:14px}.reviewer span{color:var(--muted);font-size:11px;text-align:right}
.review-hint{text-align:center;color:#7a8098;font-size:12px;font-weight:700;margin-top:2px}

/* BUY */
.buy{background:linear-gradient(135deg,#0d1230,#1a2050);color:#fff;position:relative;overflow:hidden}.buy:before{content:"";position:absolute;width:450px;height:450px;border-radius:50%;background:rgba(255,178,26,.08);right:-220px;top:-180px}
.buy .in{position:relative;z-index:1}.buy .eyebrow{color:var(--gold2)}.buy h2{margin-top:10px}.buy .lede{color:#c1c7df}
.buy-card{margin-top:28px;background:#fff;color:var(--ink);border-radius:24px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.22);max-width:560px;margin-left:auto;margin-right:auto}
.buy-price{display:flex;align-items:end;gap:10px}.buy-price b{font:800 3.2rem/1 var(--display)}.buy-price s{color:var(--muted);font-size:16px}.save2{color:var(--green);font-size:13px;font-weight:800;margin-top:7px}
.lang{display:flex;justify-content:space-between;align-items:center;gap:15px;text-decoration:none;background:linear-gradient(135deg,#ffb21a,#ffd15a);color:#2a1a00;border-radius:14px;padding:16px 18px;box-shadow:0 6px 0 #b97a00;transition:.15s transform;margin-top:20px}
.lang:hover{transform:translateY(-1px)}.lang:active{transform:translateY(4px);box-shadow:0 2px 0 #b97a00}
.lang .nm{font-size:1.2rem;font-weight:800}.lang .ed{display:block;font-size:12px;opacity:.75}.lang .go{font-weight:800;white-space:nowrap}
.others{margin-top:18px;text-align:center;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:center;align-items:center}
.others a{display:inline-block;padding:7px 14px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-weight:700;color:var(--ink);background:#f7f8fc}
.others a:hover{border-color:var(--gold)}
.assure{display:flex;flex-wrap:wrap;justify-content:center;gap:7px 16px;margin-top:16px;color:var(--muted);font-size:12.5px}.assure span:before{content:"✓";color:var(--green);font-weight:900;margin-right:5px}

/* HOW / FIT / FAQ */
.steps{display:grid;gap:14px;margin-top:28px}.step{display:grid;grid-template-columns:48px 1fr;gap:14px;padding:18px;border-radius:17px;background:#fff;border:1px solid var(--line)}.step-n{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font:800 1.15rem var(--display)}.step h3{font-size:1.08rem}.step p{margin-top:4px;color:var(--muted);font-size:14px}
.fit{display:grid;gap:14px;margin-top:28px}.fit-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:21px}.fit-card h3{font-size:1.2rem}.fit-card ul{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:9px}.fit-card li{font-size:14px;display:flex;gap:8px}.fit-card.yes li:before{content:"✓";color:var(--green);font-weight:900;flex:none}.fit-card.no li:before{content:"×";color:#8b90a7;font-weight:900;flex:none}
.faq{display:grid;gap:10px;margin-top:28px}.faq details{background:#fff;border:1px solid var(--line);border-radius:14px}.faq summary{cursor:pointer;list-style:none;padding:17px 48px 17px 18px;font-weight:800;position:relative}.faq summary::-webkit-details-marker{display:none}.faq summary:after{content:"+";position:absolute;right:18px;top:13px;font-size:24px;color:var(--muted);font-weight:400}.faq details[open] summary:after{content:"−"}.ans{padding:0 18px 18px;color:var(--muted);font-size:14px}

/* FINAL CTA */
.final-cta{background:#fff;padding:68px 0 82px}.final-box{background:linear-gradient(135deg,#171d48,#0d1230);border-radius:26px;color:#fff;text-align:center;padding:36px 22px;box-shadow:var(--shadow)}.final-box h2{margin-top:9px}.final-box p{margin:12px auto 0;color:#c3c8de;max-width:600px}.final-box .cta-main{margin-top:20px}

/* FOOTER */
footer{background:#fff;border-top:1px solid var(--line);padding:34px 0;color:var(--muted);font-size:13px}.footer-brand{font:800 1.1rem var(--display);color:var(--ink)}.contact{margin-top:10px}.fine{margin-top:16px;max-width:800px;font-size:12px;line-height:1.5}

/* STICKY */
.sticky{position:fixed;z-index:50;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);box-shadow:0 -12px 30px rgba(17,21,47,.10);padding:9px 14px calc(9px + env(safe-area-inset-bottom))}
.sticky-row{width:min(1100px,100%);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.sticky-price{display:flex;align-items:baseline;gap:7px}.sticky-price b{font:800 1.55rem var(--display)}.sticky-price s{font-size:12px;color:var(--muted)}.sticky .cta-main{padding:12px 17px;min-height:46px;font-size:14px}

/* RESPONSIVE */
@media(min-width:700px){
 .in{width:min(1100px,calc(100% - 56px))}.section{padding:90px 0}
 .hero{padding-top:25px}.hero-grid{grid-template-columns:1.02fr .98fr;gap:50px}.hero-art{min-height:510px}
 .value-grid{grid-template-columns:repeat(4,1fr)}.pain-grid{grid-template-columns:1fr .9fr}.problem-card{margin-top:0}
 .guides{grid-template-columns:1fr 1fr}.guide{padding:20px}.guide img{width:110px}.guide{grid-template-columns:110px 1fr}
 .fit{grid-template-columns:1fr 1fr}.steps{grid-template-columns:repeat(3,1fr)}.step{display:block}.step-n{margin-bottom:13px}
 .buy-card{padding:30px}
}
@media(min-width:980px){
 .hero h1{max-width:700px}.hero-art{min-height:540px}.fan{height:480px}.fan img{width:28%}.fan .a{transform:translate(-145px,28px) rotate(-12deg)}.fan .b{transform:translate(-78px,10px) rotate(-6deg)}.fan .c{transform:translate(78px,10px) rotate(6deg)}.fan .d{transform:translate(145px,28px) rotate(12deg)}
}
@media(max-width:520px){
 .hero{padding-bottom:48px}.hero:after{bottom:-150px}.hero-art{min-height:330px}.fan{height:330px}.orbit{width:285px;height:285px}.fan .a{transform:translate(-76px,18px) rotate(-11deg)}.fan .b{transform:translate(-41px,6px) rotate(-5deg)}.fan .c{transform:translate(41px,6px) rotate(5deg)}.fan .d{transform:translate(76px,18px) rotate(11deg)}
 .system-flow{grid-template-columns:1fr}.offer .now{font-size:2.9rem}.topbar .secure{display:none}

}

var LINKS={
  hi:"https://superprofile.bio/vp/dream_life?checkout=true",
  gu:"https://superprofile.bio/vp/the-dream-life-guj?checkout=true",
  en:"https://superprofile.bio/vp/the-dream-life-english?checkout=true"
};
var NAMES={hi:"हिन्दी",gu:"ગુજરાતી",en:"English"};
var ORDER=["en","hi","gu"];
var DEFAULT="hi";

function pick(){
  var q=null;
  try{q=new URLSearchParams(location.search).get("lang");}catch(e){}
  if(q&&T[q])return q;
  try{var s=localStorage.getItem("bg_lang");if(s&&T[s])return s;}catch(e){}
  return DEFAULT;
}

function setLang(l,fromUser){
  if(!T[l])l=DEFAULT;
  var d=T[l],en=T.en;
  document.documentElement.lang=l;
  var nodes=document.querySelectorAll("[data-i18n]");
  for(var i=0;i<nodes.length;i++){
    var k=nodes[i].getAttribute("data-i18n");
    var v=(d[k]!==undefined)?d[k]:en[k];
    if(v!==undefined)nodes[i].innerHTML=v;
  }
  document.title=d.title;
  var md=document.querySelector('meta[name="description"]');if(md)md.setAttribute("content",d.desc);
  var ot=document.querySelector('meta[property="og:title"]');if(ot)ot.setAttribute("content",d.title);

  /* switcher state */
  var btns=document.querySelectorAll(".lang-sw button");
  for(var j=0;j<btns.length;j++){
    btns[j].setAttribute("aria-pressed",btns[j].getAttribute("data-l")===l?"true":"false");
  }

  /* buy button for the selected language + links to other editions */
  var main=document.getElementById("buyMain");
  main.href=LINKS[l];
  document.getElementById("buyName").textContent=NAMES[l];
  var box=document.getElementById("others");
  box.innerHTML="";
  var lab=document.createElement("span");lab.textContent=d.buyOther;box.appendChild(lab);
  ORDER.forEach(function(o){
    if(o===l)return;
    var a=document.createElement("a");
    a.href=LINKS[o];a.target="_blank";a.rel="noopener";a.className="js-buy";
    a.textContent=NAMES[o];
    box.appendChild(a);
  });

  try{localStorage.setItem("bg_lang",l);}catch(e){}
  if(fromUser){
    try{history.replaceState(null,"",location.pathname+"?lang="+l+location.hash);}catch(e){}
    if(typeof fbq==="function")fbq("trackCustom","LanguageSelected",{language:l});
  }
}

document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest(".lang-sw button");
  if(b){setLang(b.getAttribute("data-l"),true);return;}
  var buy=e.target.closest&&e.target.closest(".js-buy");
  if(buy&&typeof fbq==="function"){
    fbq("track","InitiateCheckout",{value:299,currency:"INR",content_name:"Dream Life Bundle ("+document.documentElement.lang+")"});
  }
});

setLang(pick(),false);
})();
